const dictionaries={en:{retroDemo:'Retrowave demo',statusbar:'Status bar',tabs:'Tab titles',effect:'Window background',preset:'Workspace',intro:'Choose a palette, then choose your prompt. Saved preferences travel through upgrades. Nord + rounded remains the initial default.',style:'Prompt style',font:'Preview font',spacing:'Line spacing',icons:'Icons',suggestions:'Suggestions',search:'Search themes',filter:'Palette',footer:'Preview only: controls do not change your terminal. Run the commands above to apply and save. Theme/style changes are immediate; font/line spacing apply when opening a new gtterm tab. Preview uses browser fonts; actual iTerm glyph rendering may differ. Tab/status examples and metrics are illustrative; actual iTerm rendering may differ. Background effects are an approximation. Control+Esc opens the native top hotkey terminal after installation. Settings menu: gtterm config.'},tr:{retroDemo:'Retrowave demosu',statusbar:'Durum çubuğu',tabs:'Sekme başlıkları',effect:'Pencere arka planı',preset:'Çalışma görünümü',intro:'Önce paletini, sonra prompt görünümünü seç. Kayıtlı tercihler güncellemelerde korunur. Başlangıç varsayılanı Nord + rounded kalır.',style:'Prompt görünümü',font:'Önizleme fontu',spacing:'Satır aralığı',icons:'İkonlar',suggestions:'Öneriler',search:'Tema ara',filter:'Palet',footer:'Yalnızca önizleme: buradaki kontroller terminalini değiştirmez. Uygulayıp kaydetmek için yukarıdaki komutları çalıştır. Tema/görünüm hemen, font/satır aralığı yeni gtterm sekmesinde uygulanır. Tarayıcı fontu kullanılır; iTerm’de gerçek karakterler farklı görünebilir. Sekme/durum ve metrikler örnektir; gerçek iTerm çizimi farklı olabilir. Arka plan efektleri yaklaşık gösterimdir. Kurulumdan sonra Control+Esc yerleşik üst hotkey terminalini açar. Ayar menüsü: gtterm config.'}};
let current=themes.find(t=>t.slug==='nord');
function settings(){return {style:$('style').value,icons:$('icons').checked,suggestions:$('suggestions').checked}}
function content(t,mini=false){const C=t.colors,s=settings();const ascii=s.style==='ascii';const icon=s.icons&&!ascii?'● ':'';const arrow=ascii?'&gt;':'❯';let prompt='';
 if(s.style==='rounded'||s.style==='powerline'){const round=s.style==='rounded';let cap=`<span style="background:${C[4]};color:${t.bg};border-radius:${round?'12px 0 0 12px':'0'};padding:3px 8px">${icon}~/workspace/agent-project </span><span style="background:${C[2]};color:${t.bg};border-radius:${round?'0 12px 12px 0':'0'};padding:3px 8px">${round?'':'▶ '}main </span>`;prompt=(round?`<span style="color:${t.fg};opacity:.48">╭─</span>`:'')+cap+'\n'+(round?`<span style="color:${t.fg};opacity:.48">╰─ </span>`:'')+`<span style="color:${C[2]}">${arrow}</span> `;}
 else{let line=`<span style="color:${C[4]}">~/workspace/agent-project</span> <span style="color:${C[2]}">${ascii?'':icon}main</span>`;prompt=(ascii?'+-':'')+line+(s.style==='compact'?' ':'\n'+(ascii?'+- ':''))+`<span style="color:${C[2]}">${arrow}</span> `;}
 const command=`<span style="color:${C[2]}">gtterm</span> cli`;
 return prompt+command+(mini?'':`\n<span style="color:${C[6]}">COMMAND       STATUS\ncodex         available\nclaude        available\ncopilot       available</span>\n\n`+prompt+(s.suggestions?`<span style="opacity:.58">gtterm theme ${esc(t.slug)}</span>`:''));}
function update(){let s=settings();document.documentElement.style.setProperty('--preview-font',$('font').value+'px');document.documentElement.style.setProperty('--preview-line',({relaxed:'1.9',normal:'1.7',compact:'1.5'})[$('spacing').value]);$('fontValue').textContent=$('font').value+' px';$('title').textContent='gtterm - '+current.name+' / '+s.style;let screen=$('screen');screen.style.background=$('effect').value==='retrowave'?`linear-gradient(${current.bg}44,${current.bg}44),url(${retroUrl}) center/cover`:current.bg+({off:'',glass:'e0',frost:'c7'})[$('effect').value];screen.parentElement.style.background=$('effect').value==='off'?'':'linear-gradient(120deg,#3b2266,#087c87,#aa2e79)';screen.style.backdropFilter=['off','retrowave'].includes($('effect').value)?'none':'blur('+($('effect').value==='glass'?8:14)+'px)';screen.style.color=current.fg;screen.innerHTML=content(current);$('commands').textContent=$('preset').value!=='custom'?`gtterm theme ${current.slug}\ngtterm preset ${$('preset').value}`:`gtterm theme ${current.slug}\ngtterm style ${s.style}\ngtterm config set font-size ${$('font').value}\ngtterm config set line-spacing ${$('spacing').value}\ngtterm config set icons ${s.icons?'on':'off'}\ngtterm config set suggestions ${s.suggestions?'on':'off'}`;
 $('commands').textContent+='\ngtterm background '+$('effect').value+'\ngtterm statusbar '+$('statusbar').value+'\ngtterm tabs '+$('tabs').value;
 $('tabstrip').style.setProperty('--tab-accent',current.colors[5]);$('tabstrip').innerHTML=$('tabs').value==='smart'?'<span>agent-project — codex</span><span>docs — zsh</span>':`<span>gtterm - ${esc(current.name)}</span><span>gtterm - Nord</span>`;
 let status=$('statusline');status.style.display=$('statusbar').value==='off'?'none':'flex';status.style.background=current.bg;status.style.color=current.fg;status.innerHTML='<span>~/workspace/agent-project</span><span>codex</span><span class="spacer"></span>'+($('statusbar').value==='dashboard'?`<span><svg viewBox="0 0 60 16"><polyline fill="none" stroke="${current.colors[4]}" points="0,13 6,10 12,12 18,4 24,9 30,7 36,11 42,3 48,8 54,7 60,10"/></svg>CPU 12%</span><span><svg viewBox="0 0 60 16"><polyline fill="none" stroke="${current.colors[5]}" points="0,10 6,9 12,9 18,7 24,8 30,7 36,7 42,6 48,7 54,6 60,6"/></svg>RAM 48%</span>`:'')+'<span>14:32</span>';

 document.querySelectorAll('.card').forEach(b=>{let t=themes.find(t=>t.slug===b.dataset.slug);b.setAttribute('aria-pressed',String(t===current));b.querySelector('.mini').innerHTML=content(t,true)});filter();}
function filter(){let visible=0;const q=$('search').value.toLowerCase(),mode=$('filter').value;document.querySelectorAll('.card').forEach(b=>{const t=themes.find(t=>t.slug===b.dataset.slug),hex=t.bg.slice(1),rgb=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16)),light=rgb.reduce((a,b)=>a+b,0)/3>150;let show=(t.name+' '+t.slug).toLowerCase().includes(q)&&(mode==='all'||(mode==='light')===light);b.hidden=!show;if(show)visible++});$('count').textContent=visible+' / 40';}
for(const t of themes){let b=document.createElement('button');b.className='card';b.dataset.slug=t.slug;b.setAttribute('aria-pressed','false');b.innerHTML=`<div class="label">${esc(t.name)} ${t.slug==='nord'?'<span class="badge">DEFAULT</span>':''}</div><div class="mini" style="background:${t.bg};color:${t.fg}"></div><div class="swatches">${t.colors.slice(0,8).map(c=>`<i style="background:${c}"></i>`).join('')}</div>`;b.onclick=()=>{current=t;update()};$('grid').appendChild(b)}
for(const id of ['style','font','spacing','icons','suggestions'])$(id).addEventListener('input',()=>{$('preset').value='custom';update()});
$('preset').addEventListener('change',()=>{const presets={work:['rounded',15,'relaxed',true,true],focus:['minimal',14,'compact',false,true],presentation:['minimal',20,'relaxed',false,false]},p=presets[$('preset').value];if(p){$('style').value=p[0];$('font').value=p[1];$('spacing').value=p[2];$('icons').checked=p[3];$('suggestions').checked=p[4]}update()});
$('effect').addEventListener('change',update);$('statusbar').addEventListener('change',update);$('tabs').addEventListener('change',update);$('retroDemo').onclick=()=>{current=themes.find(t=>t.slug==='synthwave');$('effect').value='retrowave';$('statusbar').value='dashboard';$('tabs').value='smart';update()};
$('search').addEventListener('input',filter);$('filter').addEventListener('change',filter);
function translate(){let lang=$('language').value,d=dictionaries[lang];document.documentElement.lang=lang;$('intro').textContent=d.intro;$('footer').textContent=d.footer;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=d[el.dataset.i]);$('preset').options[0].textContent=lang==='tr'?'Özel':'Custom';$('filter').options[0].textContent=lang==='tr'?'Tümü':'All';$('filter').options[1].textContent=lang==='tr'?'Koyu':'Dark';$('filter').options[2].textContent=lang==='tr'?'Açık':'Light'}
$('language').addEventListener('change',translate);translate();update();
</script></html>
